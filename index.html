<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주 문화·역사</title>
<style>
  :root {
    --bg: #f6f3ec; --card: #fff; --ink: #1f2a2e; --sub: #5d6a6e;
    --line: #e3ded2; --accent: #1f6f78; --accent-soft: #dcefef; --star: #d9822b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14191b; --card: #1d2528; --ink: #e8eef0; --sub: #9db0b5;
            --line: #2c383c; --accent: #5cc0c9; --accent-soft: #1d3a3e; --star: #f0a04b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; line-height: 1.6; }
  header { padding: 40px 16px 24px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 2rem; }
  header p { margin: 0; color: var(--sub); }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }
  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .tools input, .tools select { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--card); color: var(--ink); font: inherit; }
  .tools input { flex: 1 1 220px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px;
          background: var(--card); color: var(--ink); cursor: pointer; font: inherit; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { color: var(--sub); font-size: .9rem; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .tag { font-size: .75rem; background: var(--accent-soft); color: var(--accent);
         padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .card h3 { margin: 0; font-size: 1.1rem; }
  .meta { color: var(--sub); font-size: .82rem; }
  .desc { margin: 0; font-size: .93rem; flex: 1; }
  .foot { display: flex; justify-content: space-between; align-items: center; }
  .score { color: var(--star); font-weight: 700; font-size: .9rem; }
  .pick { border: 1px solid var(--accent); background: transparent; color: var(--accent);
          padding: 5px 12px; border-radius: 8px; cursor: pointer; font: inherit; font-size: .85rem; }
  .card.sel .pick { background: var(--accent); color: #fff; }
  .wish { margin-top: 36px; background: var(--card); border: 1px solid var(--line);
          border-radius: 12px; padding: 18px; }
  .wish h2 { margin: 0 0 10px; font-size: 1.2rem; }
  .wish ul { margin: 0; padding-left: 20px; }
  .wish li { margin: 4px 0; }
  .empty { color: var(--sub); }
  .msg { text-align: center; color: var(--sub); padding: 40px 0; }
  footer { text-align: center; color: var(--sub); font-size: .8rem; padding: 0 16px 30px; }
</style>
</head>
<body>
<header>
  <h1>제주 문화·역사</h1>
  <p>전통문화와 설화, 문화유산의 이름과 특징</p>
</header>
<main>
  <div class="tools">
    <input id="q" type="search" placeholder="이름·설명으로 검색">
    <select id="sort" aria-label="정렬">
      <option value="score">점수 높은 순</option>
      <option value="name">이름 가나다순</option>
      <option value="default">기본 순서</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="msg" id="msg" hidden></p>

  <section class="wish">
    <h2>가 보고 싶은 곳</h2>
    <ul id="wishList"></ul>
  </section>
</main>
<footer>점수는 입문 추천도이며 주관적 값입니다. 연도·지정 정보는 방문 전 공식 자료로 확인하세요.</footer>

<script>
const $ = id => document.getElementById(id);
let items = [], category = "전체";
const STORE = "jeju_culture_selected";

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(items.filter(i => i.selected).map(i => i.name))); } catch {}
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderChips() {
  const cats = ["전체", ...new Set(items.map(i => i.category))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip ${c === category ? "on" : ""}" data-c="${esc(c)}">${esc(c)}${c === "전체" ? "" : " " + items.filter(i => i.category === c).length}</button>`
  ).join("");
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  let list = items.filter(i =>
    (category === "전체" || i.category === category) &&
    (!q || (i.name + " " + i.description).toLowerCase().includes(q)));
  const sort = $("sort").value;
  if (sort === "score") list = [...list].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "ko"));
  if (sort === "name") list = [...list].sort((a, b) => a.name.localeCompare(b.name, "ko"));

  $("count").textContent = `${list.length}개 항목`;
  $("msg").hidden = list.length > 0;
  $("msg").textContent = "조건에 맞는 항목이 없습니다.";
  $("grid").innerHTML = list.map(i => `
    <article class="card ${i.selected ? "sel" : ""}">
      <div class="top"><h3>${esc(i.name)}</h3><span class="tag">${esc(i.category)}</span></div>
      <div class="meta">${esc(i.area || "")}${i.period ? " · " + esc(i.period) : ""}</div>
      <p class="desc">${esc(i.description)}</p>
      <div class="foot">
        <span class="score">★ ${i.score}</span>
        <button class="pick" data-n="${esc(i.name)}">${i.selected ? "✓ 담음" : "+ 가 보고 싶어요"}</button>
      </div>
    </article>`).join("");

  const picked = items.filter(i => i.selected);
  $("wishList").innerHTML = picked.length
    ? picked.map(i => `<li><strong>${esc(i.name)}</strong> <span class="meta">${esc(i.category)} · ${esc(i.area || "")}</span></li>`).join("")
    : `<li class="empty">카드의 버튼을 눌러 담아 보세요.</li>`;
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  category = b.dataset.c; renderChips(); render();
});
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".pick"); if (!b) return;
  const it = items.find(i => i.name === b.dataset.n);
  it.selected = !it.selected; save(); render();
});
$("q").addEventListener("input", render);
$("sort").addEventListener("change", render);

fetch("jeju_culture.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => {
    items = data.items;
    const saved = loadSaved();
    if (Array.isArray(saved)) items.forEach(i => i.selected = saved.includes(i.name));
    renderChips(); render();
  })
  .catch(() => {
    $("msg").hidden = false;
    $("msg").textContent = "데이터를 불러오지 못했습니다. 파일을 직접 열지 말고 로컬 서버나 배포 주소로 접속하세요.";
  });
</script>
</body>
</html>
